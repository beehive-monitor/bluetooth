<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Beehive Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7d6, #ffe29a);
      color: #2c2105;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .bee-icon {
      font-size: 54px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 21px;
    }

    .subtitle {
      margin-top: 8px;
      color: #6b5a25;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(80, 55, 0, 0.15);
    }

    .status-card {
      text-align: center;
    }

    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      background: #c7c7c7;
      vertical-align: middle;
    }

    .connected {
      background: #2ecc71;
    }

    .warning {
      background: #f39c12;
    }

    .error {
      background: #e74c3c;
    }

    .status-text {
      font-size: 18px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #f5a400;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(120, 80, 0, 0.2);
      margin-top: 10px;
    }

    button:hover {
      background: #e69500;
    }

    button:disabled {
      background: #c7c7c7;
      cursor: not-allowed;
      box-shadow: none;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .data-box {
      background: #fff8df;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .wide-box {
      grid-column: span 2;
    }

    .label {
      font-size: 13px;
      color: #7b6a2e;
      margin-bottom: 6px;
    }

    .value {
      font-size: 24px;
      font-weight: bold;
    }

    .message-log {
      max-height: 180px;
      overflow-y: auto;
      background: #fff8df;
      border-radius: 14px;
      padding: 10px;
      font-size: 14px;
      line-height: 1.4;
      color: #2c2105;
    }

    .message-entry {
      padding: 7px 0;
      border-bottom: 1px solid #f0e1aa;
    }

    .message-entry:last-child {
      border-bottom: none;
    }

    .message-time {
      display: block;
      font-size: 11px;
      color: #7b6a2e;
      margin-bottom: 2px;
    }

    .file-status {
      font-size: 14px;
      color: #6b5a25;
      margin-top: 8px;
      line-height: 1.4;
    }

    .file-grid {
      margin-top: 14px;
      overflow: hidden;
      background: #000;
      border-radius: 12px;
    }

    .file-grid canvas {
      display: none;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      vertical-align: bottom;
    }

    .file-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .file-buttons button {
      margin-top: 0;
      padding: 12px 8px;
      font-size: 14px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="bee-icon">🐝</div>
      <h1>Beehive Monitor</h1>
      <div class="subtitle">Simple hive health updates from your Raspberry Pi</div>
    </div>

    <div class="card status-card">
      <p>
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText" class="status-text">Not connected</span>
      </p>

      <button id="connectBtn">Connect to Hive Sensor</button>
    </div>

    <div class="card">
      <h2>Bluetooth Messages</h2>
      <div id="bluetoothMessageLog" class="message-log">
        <div class="message-entry"></div>
      </div>
    </div>

    <div class="card">
      <h2>Received Files</h2>

      <div class="file-grid">
        <canvas id="combinedCanvas"></canvas>
      </div>

      <div class="file-buttons">
        <button id="combinedCsvBtn" disabled>Combined CSV: Waiting</button>
        <button id="combinedPgmBtn" disabled>Combined PGM: Waiting</button>
      </div>

      <div id="combineStatus" class="file-status">
        Waiting for the combined CSV and PGM from the Raspberry Pi.
      </div>
    </div>

    <div class="card">
      <h2>Main Results</h2>

      <div class="data-grid">
        <div class="data-box">
          <div class="label">Warmest Area</div>
          <div id="maxTemp" class="value">-- °C</div>
        </div>

        <div class="data-box">
          <div class="label">Coolest Area</div>
          <div id="minTemp" class="value">-- °C</div>
        </div>

        <div class="data-box wide-box">
          <div class="label">Estimated Mite / Infected Cell Count</div>
          <div id="miteCount" class="value">--</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "12345678-1234-5678-1234-56789abcdef0";
    const CHAR_UUID = "abcdef01-1234-5678-1234-56789abcdef0";

    const connectBtn = document.getElementById("connectBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const bluetoothMessageLog =
      document.getElementById("bluetoothMessageLog");

    const maxTempBox = document.getElementById("maxTemp");
    const minTempBox = document.getElementById("minTemp");
    const miteCountBox = document.getElementById("miteCount");

    const combinedCsvBtn = document.getElementById("combinedCsvBtn");
    const combinedPgmBtn = document.getElementById("combinedPgmBtn");
    const combineStatus = document.getElementById("combineStatus");

    let latestData = {};
    let fileTransfers = {};
    let combinedCsvFile = null;
    let combinedPgmFile = null;

    function setConnectionStatus(type, message) {
      statusDot.className = "status-dot";

      if (type === "connected") {
        statusDot.classList.add("connected");
      } else if (type === "warning") {
        statusDot.classList.add("warning");
      } else if (type === "error") {
        statusDot.classList.add("error");
      }

      statusText.textContent = message;
    }

    function addBluetoothMessage(message) {
      const entry = document.createElement("div");
      entry.className = "message-entry";

      const time = document.createElement("span");
      time.className = "message-time";
      time.textContent = new Date().toLocaleTimeString();

      const text = document.createElement("span");
      text.textContent = message;

      entry.appendChild(time);
      entry.appendChild(text);
      bluetoothMessageLog.insertBefore(
        entry,
        bluetoothMessageLog.firstChild
      );

      while (bluetoothMessageLog.children.length > 30) {
        bluetoothMessageLog.removeChild(
          bluetoothMessageLog.lastChild
        );
      }
    }

    function parseSensorMessage(message) {
      const result = {};
      const parts = message.trim().split(";");

      parts.forEach(part => {
        const cleanPart = part.trim();

        if (cleanPart.length === 0) {
          return;
        }

        const equalsIndex = cleanPart.indexOf("=");

        if (equalsIndex === -1) {
          result[cleanPart] = true;
          return;
        }

        const key =
          cleanPart.substring(0, equalsIndex).trim();
        const value =
          cleanPart.substring(equalsIndex + 1).trim();

        result[key] = value;
      });

      return result;
    }

    function hasKey(data, key) {
      return Object.prototype.hasOwnProperty.call(data, key);
    }

    function numberOrNull(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function setNumberIfPresent(
      data,
      key,
      element,
      decimals,
      suffix = ""
    ) {
      if (!hasKey(data, key)) {
        return;
      }

      const n = numberOrNull(data[key]);

      if (n !== null) {
        element.textContent =
          n.toFixed(decimals) + suffix;
      }
    }

    function setIntegerIfPresent(data, key, element) {
      if (!hasKey(data, key)) {
        return;
      }

      const n = numberOrNull(data[key]);

      if (n !== null) {
        element.textContent =
          String(Math.round(n));
      }
    }

    function getPictureNumber(data) {
      const n = Number(
        data.PIC || data.PICTURE || data.INDEX || 0
      );

      return Number.isInteger(n) ? n : 0;
    }

    function getTransferKey(tag, pic) {
      return tag + "_" + String(pic);
    }

    function isCsvTag(tag) {
      return tag === "COMBINED_CSV";
    }

    function isPgmTag(tag) {
      return tag === "COMBINED_PGM";
    }

    function base64ToBytes(base64Text) {
      const binary = atob(base64Text);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    /*
     * Direct browser download only.
     *
     * This function uses only a standard browser download, so clicking either
     * file button no longer intentionally opens the phone share sheet.
     */
    function downloadFileRecord(fileRecord) {
      if (!fileRecord) {
        alert("This file has not finished transferring.");
        return;
      }

      const temporaryUrl =
        URL.createObjectURL(fileRecord.blob);
      const link = document.createElement("a");

      link.href = temporaryUrl;
      link.download = fileRecord.name || "download";
      link.style.display = "none";

      document.body.appendChild(link);
      link.click();
      link.remove();

      /*
       * Leave the object URL alive briefly so mobile browsers have time
       * to begin processing the download before it is released.
       */
      window.setTimeout(() => {
        URL.revokeObjectURL(temporaryUrl);
      }, 30000);
    }

    combinedCsvBtn.addEventListener("click", () => {
      downloadFileRecord(combinedCsvFile);
    });

    combinedPgmBtn.addEventListener("click", () => {
      downloadFileRecord(combinedPgmFile);
    });

    function updateCombineStatus() {
      const csvReady = combinedCsvFile !== null;
      const pgmReady = combinedPgmFile !== null;

      if (csvReady && pgmReady) {
        combineStatus.textContent =
          "Combined CSV and PGM received from the Raspberry Pi.";
      } else if (csvReady) {
        combineStatus.textContent =
          "Combined CSV received. Waiting for combined PGM.";
      } else if (pgmReady) {
        combineStatus.textContent =
          "Combined PGM received. Waiting for combined CSV.";
      } else {
        combineStatus.textContent =
          "Waiting for the combined CSV and PGM from the Raspberry Pi.";
      }
    }

    function readPgmToken(bytes, state) {
      while (state.index < bytes.length) {
        const ch = bytes[state.index];

        if (ch === 35) {
          while (
            state.index < bytes.length &&
            bytes[state.index] !== 10
          ) {
            state.index++;
          }
        } else if (
          ch === 9 ||
          ch === 10 ||
          ch === 13 ||
          ch === 32
        ) {
          state.index++;
        } else {
          break;
        }
      }

      let token = "";

      while (state.index < bytes.length) {
        const ch = bytes[state.index];

        if (
          ch === 9 ||
          ch === 10 ||
          ch === 13 ||
          ch === 32
        ) {
          break;
        }

        token += String.fromCharCode(ch);
        state.index++;
      }

      return token;
    }

    function parsePgmBytes(bytes) {
      const state = { index: 0 };
      const magic = readPgmToken(bytes, state);
      const width = Number(readPgmToken(bytes, state));
      const height = Number(readPgmToken(bytes, state));
      const maxValue =
        Number(readPgmToken(bytes, state));

      if (
        magic !== "P5" ||
        !Number.isInteger(width) ||
        width <= 0 ||
        !Number.isInteger(height) ||
        height <= 0 ||
        !Number.isInteger(maxValue) ||
        maxValue <= 0 ||
        maxValue > 65535
      ) {
        throw new Error("Unsupported PGM header.");
      }

      if (
        bytes[state.index] === 13 &&
        bytes[state.index + 1] === 10
      ) {
        state.index += 2;
      } else if (
        bytes[state.index] === 9 ||
        bytes[state.index] === 10 ||
        bytes[state.index] === 13 ||
        bytes[state.index] === 32
      ) {
        state.index++;
      } else {
        throw new Error(
          "PGM header is missing its pixel-data separator."
        );
      }

      const bytesPerPixel = maxValue < 256 ? 1 : 2;
      const requiredLength =
        width * height * bytesPerPixel;

      if (
        bytes.length <
        state.index + requiredLength
      ) {
        throw new Error("PGM pixel data is incomplete.");
      }

      return {
        width: width,
        height: height,
        maxValue: maxValue,
        bytesPerPixel: bytesPerPixel,
        pixels: bytes.slice(
          state.index,
          state.index + requiredLength
        )
      };
    }

    function drawPgmPreview(bytes) {
      const canvas =
        document.getElementById("combinedCanvas");

      if (!canvas) {
        return;
      }

      let pgm;

      try {
        pgm = parsePgmBytes(bytes);
      } catch (error) {
        addBluetoothMessage(
          "PGM preview error: " + error.message
        );
        return;
      }

      canvas.width = pgm.width;
      canvas.height = pgm.height;
      canvas.style.display = "block";

      const ctx = canvas.getContext("2d");
      const imageData =
        ctx.createImageData(pgm.width, pgm.height);
      const pixelCount = pgm.width * pgm.height;

      for (let i = 0; i < pixelCount; i++) {
        let value;

        if (pgm.bytesPerPixel === 1) {
          value = pgm.pixels[i];
        } else {
          value =
            (pgm.pixels[i * 2] << 8) |
            pgm.pixels[i * 2 + 1];
        }

        const gray =
          Math.round((value * 255) / pgm.maxValue);
        const outIndex = i * 4;

        imageData.data[outIndex] = gray;
        imageData.data[outIndex + 1] = gray;
        imageData.data[outIndex + 2] = gray;
        imageData.data[outIndex + 3] = 255;
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function updateUserDisplay(message) {
      const data = parseSensorMessage(message);

      latestData =
        Object.assign(latestData, data);

      setNumberIfPresent(
        latestData,
        "MAX_TEMP",
        maxTempBox,
        1,
        " °C"
      );

      setNumberIfPresent(
        latestData,
        "MIN_TEMP",
        minTempBox,
        1,
        " °C"
      );

      setIntegerIfPresent(
        latestData,
        "MITE_COUNT",
        miteCountBox
      );

      if (hasKey(data, "MESSAGE")) {
        addBluetoothMessage(data.MESSAGE);
      }
    }

    function handleFileMessage(message) {
      const type = message.trim().split(";")[0];
      const data = parseSensorMessage(message);
      const tag =
        String(data.TAG || "UNKNOWN").toUpperCase();
      const pic = getPictureNumber(data);
      const key = getTransferKey(tag, pic);

      if (!isCsvTag(tag) && !isPgmTag(tag)) {
        addBluetoothMessage(
          "Unexpected file type: " + tag
        );
        return;
      }

      if (type === "FILE_BEGIN") {
        fileTransfers[key] = {
          tag: tag,
          pic: pic,
          name:
            data.NAME ||
            (isCsvTag(tag)
              ? "combined_thermal_scan.csv"
              : "combined_thermal_scan.pgm"),
          chunks: [],
          receivedChunks: 0
        };

        if (isCsvTag(tag)) {
          combinedCsvBtn.disabled = true;
          combinedCsvBtn.textContent =
            "Receiving Combined CSV...";
        } else {
          combinedPgmBtn.disabled = true;
          combinedPgmBtn.textContent =
            "Receiving Combined PGM...";
        }

        return;
      }

      if (type === "FILE_CHUNK") {
        const transfer = fileTransfers[key];

        if (!transfer) {
          addBluetoothMessage(
            "Chunk received before FILE_BEGIN for " + tag + "."
          );
          return;
        }

        const seq = Number(data.SEQ);

        if (!Number.isInteger(seq) || seq < 0) {
          addBluetoothMessage(
            "Bad chunk sequence number for " + tag + "."
          );
          return;
        }

        if (transfer.chunks[seq] === undefined) {
          transfer.receivedChunks++;
        }

        transfer.chunks[seq] = data.DATA || "";

        if (transfer.receivedChunks % 10 === 0) {
          const label = isCsvTag(tag)
            ? "Combined CSV"
            : "Combined PGM";

          if (isCsvTag(tag)) {
            combinedCsvBtn.textContent =
              "Receiving " + label +
              " (" + transfer.receivedChunks +
              " chunks)...";
          } else {
            combinedPgmBtn.textContent =
              "Receiving " + label +
              " (" + transfer.receivedChunks +
              " chunks)...";
          }
        }

        return;
      }

      if (type === "FILE_END") {
        const transfer = fileTransfers[key];

        if (!transfer) {
          addBluetoothMessage(
            "FILE_END received before FILE_BEGIN for " +
            tag + "."
          );
          return;
        }

        if (
          transfer.chunks.length === 0 ||
          transfer.chunks.some(
            chunk => typeof chunk !== "string"
          )
        ) {
          addBluetoothMessage(
            "The received " + tag +
            " file is missing one or more chunks."
          );
          delete fileTransfers[key];
          return;
        }

        let bytes;

        try {
          bytes = base64ToBytes(
            transfer.chunks.join("")
          );
        } catch (error) {
          addBluetoothMessage(
            "Could not decode " + tag +
            ": " + error.message
          );
          delete fileTransfers[key];
          return;
        }

        if (isCsvTag(tag)) {
          const blob = new Blob(
            [bytes],
            { type: "text/csv" }
          );

          combinedCsvFile = {
            name: transfer.name,
            blob: blob
          };

          combinedCsvBtn.disabled = false;
          combinedCsvBtn.textContent =
            "Download Combined CSV";
          addBluetoothMessage(
            "Combined CSV received."
          );
        } else {
          const blob = new Blob(
            [bytes],
            {
              type:
                "image/x-portable-graymap"
            }
          );

          combinedPgmFile = {
            name: transfer.name,
            blob: blob,
            bytes: bytes
          };

          combinedPgmBtn.disabled = false;
          combinedPgmBtn.textContent =
            "Download Combined PGM";

          drawPgmPreview(bytes);

          addBluetoothMessage(
            "Combined PGM received."
          );
        }

        delete fileTransfers[key];
        updateCombineStatus();
        return;
      }

      addBluetoothMessage(
        "Unknown file message received."
      );
    }

    function handleBleMessage(message) {
      if (message.startsWith("FILE_")) {
        handleFileMessage(message);
      } else {
        updateUserDisplay(message);
      }
    }

    function friendlyError(error) {
      const text = String(error);

      if (text.includes("User cancelled")) {
        return (
          "Connection was cancelled. Press the button " +
          "again when you are ready."
        );
      }

      if (
        text.includes("Bluetooth adapter not available")
      ) {
        return (
          "Bluetooth is turned off or unavailable on " +
          "this computer."
        );
      }

      if (text.includes("No Services matching")) {
        return (
          "The hive sensor was found, but it is not " +
          "sending the expected data format."
        );
      }

      if (text.includes("NetworkError")) {
        return (
          "The connection was lost. Move closer to the " +
          "Raspberry Pi and try again."
        );
      }

      if (text.includes("NotFoundError")) {
        return (
          "No hive sensor was selected. Make sure " +
          "BeeMonitor is running on the Raspberry Pi."
        );
      }

      if (!navigator.bluetooth) {
        return (
          "This browser does not support Web Bluetooth. " +
          "Use a supported browser or the Bluefy app."
        );
      }

      return (
        "Something went wrong while connecting. Restart " +
        "the Raspberry Pi Bluetooth program and try again."
      );
    }

    connectBtn.addEventListener("click", async () => {
      try {
        if (!navigator.bluetooth) {
          throw new Error(
            "Bluetooth adapter not available"
          );
        }

        connectBtn.disabled = true;
        setConnectionStatus(
          "warning",
          "Searching for hive sensor..."
        );

        const device =
          await navigator.bluetooth.requestDevice({
            filters: [{ name: "BeeMonitor" }],
            optionalServices: [SERVICE_UUID]
          });

        setConnectionStatus(
          "warning",
          "Connecting..."
        );

        device.addEventListener(
          "gattserverdisconnected",
          () => {
            connectBtn.disabled = false;
            setConnectionStatus(
              "error",
              "Disconnected"
            );
            addBluetoothMessage(
              "Disconnected from Raspberry Pi."
            );
          }
        );

        const server = await device.gatt.connect();
        const service =
          await server.getPrimaryService(
            SERVICE_UUID
          );
        const characteristic =
          await service.getCharacteristic(
            CHAR_UUID
          );

        setConnectionStatus(
          "connected",
          "Connected to hive sensor"
        );

        await characteristic.startNotifications();
        await characteristic.readValue();

        characteristic.addEventListener(
          "characteristicvaluechanged",
          event => {
            const value = event.target.value;
            const message =
              new TextDecoder().decode(value);

            handleBleMessage(message);
          }
        );

        addBluetoothMessage("Connected.");
      } catch (error) {
        console.error(error);

        connectBtn.disabled = false;
        setConnectionStatus(
          "error",
          "Connection problem"
        );
        addBluetoothMessage(
          friendlyError(error)
        );
      }
    });
  </script>
</body>
</html>
